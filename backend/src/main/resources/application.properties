spring.application.name=capstone-project
spring.config.import=file:env.properties
# SERVER CONFIG
server.port=${PORT}
# DB CONFIG
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver=org.postgresql.Driver
# HIBERNATE
spring.jpa.hibernate.ddl-auto=update
# JWT
jwt.secret=${JWT_SECRET}
#CLOUDINARY
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.api.secret=${CLOUDINARY_SECRET}
cloudinary.api.key=${CLOUDINARY_APIKEY}
spring.servlet.multipart.max-file-size=120MB
spring.servlet.multipart.max-request-size=120MB
server.tomcat.max-http-form-post-size=120MB
server.tomcat.max-swallow-size=120MB
#ADMIN
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
#CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
